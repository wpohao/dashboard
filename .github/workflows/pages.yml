name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 需要完整歷史，才能用 commit 時間當「更新日期」

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build public dashboard (index.html)
        run: node _dashboard/build.js --public --git-dates

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r Stock _site/
          cp -r Lab _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
